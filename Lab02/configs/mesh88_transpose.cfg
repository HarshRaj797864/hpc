// Lab02 — 8x8 Mesh, Transpose Traffic
// Topology: 8-ary 2-cube (mesh), k=8, n=2 => 64 nodes
// Traffic:  transpose — node (x,y) sends to (y,x), stresses bisection bandwidth
// Matches the example in the BookSim user guide (mesh88_lat)

// Topology
topology = mesh;
k = 8;
n = 2;

// Routing
routing_function = dor;

// Flow control
num_vcs     = 8;
vc_buf_size = 8;
wait_for_tail_credit = 1;

// Router architecture
vc_allocator = islip;
sw_allocator = islip;
alloc_iters  = 1;

credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;

input_speedup     = 2;
output_speedup    = 1;
internal_speedup  = 1.0;

// Traffic
traffic      = transpose;
packet_size  = 20;

// Simulation
sim_type       = latency;
injection_rate = 0.005;           // overridden by sweep script
