// Lab02 — 8x8 Torus, Uniform Random Traffic
// Topology: 8-ary 2-cube torus (wrap-around links), k=8, n=2 => 64 nodes
// Traffic:  uniform random
// Based on the canonical torus88 BookSim example (minimal config)
// Note: torus needs >=2 VCs for deadlock-free DOR routing (Livelock avoidance)

topology = torus;
k = 8;
n = 2;

// Routing — dimension-order (X then Y), deadlock-free with 2 VCs
routing_function = dim_order;

// Flow control — 2 VCs minimum for torus DOR
num_vcs = 2;

// Traffic
traffic     = uniform;
packet_size = 1;         // single-flit packets (default)

// Simulation
sim_type       = latency;
injection_rate = 0.15;   // overridden by sweep script
