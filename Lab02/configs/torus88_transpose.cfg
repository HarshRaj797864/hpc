// Lab02 — 8x8 Torus, Transpose Traffic
// Topology: 8-ary 2-cube torus, k=8, n=2 => 64 nodes
// Traffic:  transpose — node (x,y) sends to (y,x)
//           Stresses bisection differently from uniform

topology = torus;
k = 8;
n = 2;

routing_function = dim_order;
num_vcs = 2;

// Traffic
traffic     = transpose;
packet_size = 1;

// Simulation
sim_type       = latency;
injection_rate = 0.15;   // overridden by sweep script
